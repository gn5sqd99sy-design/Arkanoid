
<html>
<head>
<title>Arkanoid</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* {
	box-sizing: border-box;
}
body {
	display: flex;
	height: 100vh;
	height: 100dvh;
	margin: 0;
	background: #211229;
}
canvas {
	display: block;
	flex: 1;
	width: 100%;
	height: auto;
	min-height: 0;
}

.game-container {
	display: flex;
	flex-direction: column;
	width: 100%;
	height: 100%;
	min-height: 0;
}
.game-instructions {
	flex: none;
        padding: 12px 8px;
        color: white;
        background: #30203d;
        font: 14px Arial, sans-serif;
        text-align: center;
        line-height: 1.8;
}
</style>
</head>
<body>
<div class="game-container">
<canvas id="mycanvas" width="640" height="360" aria-label="Arkanoidi mänguväli">
	Sinu brauser ei toeta HTML5 canvas-elementi.
</canvas>
<div class="game-instructions">
← → — Platvormi liigutamine |
Space — Palli käivitamine
<br>
P — Paus / Jätka |
R — Uus mäng pärast võitu või kaotust |
+ / − — Platvormi kiirus
</div>
</div>
<script src="game.js" type="text/javascript"></script>
</body>
</html>
